<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Teleprompter — Free & Open Source</title>
<meta name="description" content="Teleprompter gratuito, responsivo e open source. Leia roteiros com rolagem automática, espelhamento e controles personalizáveis.">
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --fg:#fff;
  --muted:#9b9b9b;
  --line:#292929;
  --panel:#080808;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;
  background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
body{overflow:hidden;touch-action:manipulation}
button,input,textarea,select{font:inherit}
button{-webkit-appearance:none;appearance:none}
button:disabled{opacity:.35;cursor:not-allowed}

.app{
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)
}
header{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:10px 0 12px;border-bottom:1px solid var(--line);flex-shrink:0
}
.brand{font-size:15px;font-weight:700;letter-spacing:.05em}
.actions{display:flex;gap:8px}
button,.file-label,select{
  background:#151515;color:#fff;border:1px solid #333;border-radius:10px;
  padding:10px 12px;font-size:14px;min-height:42px;cursor:pointer
}
button:active,.file-label:active{background:#292929}
.primary{background:#fff;color:#000;border-color:#fff;font-weight:700}
main{min-height:0;flex:1;display:flex;flex-direction:column}

#editorPanel{
  display:flex;flex-direction:column;gap:10px;padding:12px 0;flex:1;min-height:0
}
#scriptTitle{
  background:#090909;border:1px solid var(--line);border-radius:9px;
  color:#fff;padding:11px;font-size:15px;width:100%;outline:none
}
#script{
  flex:1;min-height:130px;resize:none;background:#050505;color:#fff;
  border:1px solid var(--line);border-radius:10px;padding:14px;
  font:16px/1.6 system-ui,sans-serif;outline:none
}
.file-row{display:flex;gap:8px;flex-wrap:wrap}
.file-label{display:inline-flex;align-items:center}
input[type=file]{display:none}

.settings{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
  padding:10px 0 12px;border-top:1px solid var(--line);flex-shrink:0
}
.setting{
  background:var(--panel);border:1px solid #202020;padding:10px;border-radius:10px
}
.setting label.setting-title{
  display:flex;justify-content:space-between;gap:8px;color:#ddd;
  font-size:12px;margin-bottom:8px
}
.setting output{color:#aaa}
input[type=range]{width:100%;accent-color:#fff;min-height:28px}
.speed-control{
  display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center
}
.speed-control button{min-height:38px;padding:6px;font-size:20px;line-height:1}
.checkrow{display:flex;align-items:center;gap:8px;font-size:13px;color:#ddd;margin:5px 0}
.checkrow input{accent-color:#fff;width:18px;height:18px}
.segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.segmented.two{grid-template-columns:repeat(2,1fr)}
.segmented button{padding:8px 6px;min-height:38px;font-size:12px}
.segmented button.active{background:#fff;color:#000;border-color:#fff;font-weight:700}

.playrow{display:flex;gap:8px;padding:0 0 10px;flex-shrink:0}
.playrow button{flex:1}
.status{color:var(--muted);font-size:12px;min-height:16px}

/* Leitor */
#reader{
  display:none;flex:1;min-height:0;overflow:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:45vh 0 45vh;scrollbar-width:none;
  touch-action:pan-y
}
#reader::-webkit-scrollbar{display:none}
#readerText{
  font-size:36px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;
  font-weight:450;width:72%;max-width:100%;margin:0 auto;text-align:left
}
body.reading #editorPanel,
body.reading .settings,
body.reading header,
body.reading .playrow{display:none}
body.reading #reader{display:block}
body.reading .app{padding-left:0;padding-right:0}
body.reading.mirrored #readerText{transform:scaleX(-1)}
body.reading #readerControls{display:flex}
body.controls-hidden #readerControls{opacity:0;pointer-events:none;transform:translate(-50%,18px)}
body.locked #readerControls .lock-sensitive{opacity:.3;pointer-events:none}

/* Indicador central de foco */
#focusGuide{
  display:none;position:fixed;left:0;right:0;top:50%;
  transform:translateY(-50%);height:92px;z-index:8;pointer-events:none;
  border-top:1px solid rgba(255,255,255,.14);
  border-bottom:1px solid rgba(255,255,255,.14);
  background:linear-gradient(to bottom,rgba(255,255,255,.018),rgba(255,255,255,.04),rgba(255,255,255,.018))
}
body.reading.show-focus #focusGuide{display:block}

/* Progresso */
#progressWrap{
  display:none;position:fixed;left:0;right:0;top:0;height:3px;
  background:rgba(255,255,255,.08);z-index:25
}
#progressBar{height:100%;width:0;background:#fff;transition:width .08s linear}
body.reading #progressWrap{display:block}

/* Contagem regressiva */
#countdown{
  display:none;position:fixed;inset:0;z-index:60;
  align-items:center;justify-content:center;background:#000;color:#fff;
  font-size:min(30vw,180px);font-weight:800;letter-spacing:-.05em
}
#countdown.show{display:flex}

/* Controles flutuantes */
#readerControls{
  display:none;position:fixed;left:50%;
  bottom:calc(env(safe-area-inset-bottom) + 12px);
  transform:translateX(-50%);z-index:30;align-items:center;gap:7px;padding:7px;
  border:1px solid #2b2b2b;border-radius:14px;background:rgba(0,0,0,.82);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:opacity .2s ease,transform .2s ease
}
#readerControls button{min-width:46px;min-height:44px;padding:8px 10px}
#readerControls .wide{min-width:92px}
#liveSpeed{
  min-width:46px;text-align:center;font-variant-numeric:tabular-nums;
  color:#ddd;font-size:13px
}
#progressText{
  min-width:42px;text-align:center;color:#aaa;font-size:12px;font-variant-numeric:tabular-nums
}
#lockBtn.locked-state{background:#fff;color:#000;border-color:#fff}

/* Dica curta */
#readerHint{
  display:none;position:fixed;top:calc(env(safe-area-inset-top) + 14px);
  left:50%;transform:translateX(-50%);z-index:31;
  padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.72);
  border:1px solid #242424;color:#aaa;font-size:11px;pointer-events:none
}
body.reading.show-hint #readerHint{display:block}

@media(max-width:700px){
  .settings{grid-template-columns:1fr;gap:8px}
  .setting{padding:9px}
  .playrow{gap:6px}
  .playrow button{padding-left:7px;padding-right:7px}
  #readerControls{width:calc(100% - 16px);justify-content:center;gap:5px;padding:6px}
  #readerControls button{flex:1;min-width:0;padding:7px 5px}
  #readerControls .wide{flex:1.35;min-width:0}
  #liveSpeed,#progressText{min-width:38px}
}
@media(max-height:520px) and (min-width:701px){
  .settings{grid-template-columns:repeat(4,1fr)}
  header{padding:4px 0 7px}
}

/* ===== Refinamento visual V2.1 ===== */

/* No editor, a página pode rolar normalmente.
   O bloqueio de rolagem fica reservado ao modo de leitura. */
body:not(.reading){
  overflow-y:auto;
  overflow-x:hidden;
  touch-action:auto;
}

body:not(.reading) .app{
  width:min(100%,1180px);
  min-height:100vh;
  min-height:100dvh;
  height:auto;
  margin:0 auto;
  padding:
    calc(env(safe-area-inset-top) + 18px)
    22px
    calc(env(safe-area-inset-bottom) + 22px);
}

body:not(.reading) header{
  padding:0 0 16px;
  border-bottom:1px solid #1f1f1f;
}

body:not(.reading) .brand{
  font-size:13px;
  letter-spacing:.12em;
  color:#f2f2f2;
}

body:not(.reading) .actions button{
  min-height:38px;
  padding:8px 13px;
  font-size:13px;
}

body:not(.reading) main{
  flex:none;
  min-height:auto;
}

body:not(.reading) #editorPanel{
  flex:none;
  min-height:auto;
  gap:10px;
  padding:18px 0 14px;
}

body:not(.reading) #scriptTitle{
  height:44px;
  padding:0 14px;
  border-radius:12px;
  border-color:#252525;
  background:#070707;
}

body:not(.reading) #script{
  flex:none;
  width:100%;
  height:clamp(220px,31vh,330px);
  min-height:220px;
  padding:18px;
  border-radius:14px;
  border-color:#252525;
  background:#050505;
  font-size:16px;
  line-height:1.65;
}

body:not(.reading) #script:focus,
body:not(.reading) #scriptTitle:focus{
  border-color:#555;
  box-shadow:0 0 0 1px #555;
}

body:not(.reading) .file-row{
  gap:7px;
  align-items:center;
}

body:not(.reading) .file-row button,
body:not(.reading) .file-row .file-label{
  min-height:36px;
  padding:7px 11px;
  border-radius:9px;
  font-size:12px;
  color:#d9d9d9;
  background:#101010;
  border-color:#2a2a2a;
}

body:not(.reading) .status{
  min-height:14px;
  font-size:11px;
  color:#777;
  padding-left:2px;
}

body:not(.reading) .settings{
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  padding:14px 0 12px;
  border-top:1px solid #1d1d1d;
}

body:not(.reading) .setting{
  min-width:0;
  min-height:116px;
  padding:13px;
  border-radius:14px;
  border-color:#242424;
  background:#080808;
}

body:not(.reading) .setting label.setting-title{
  margin-bottom:10px;
  font-size:11px;
  color:#bdbdbd;
}

body:not(.reading) .setting output{
  color:#8b8b8b;
}

body:not(.reading) input[type=range]{
  min-height:24px;
}

body:not(.reading) .speed-control{
  grid-template-columns:36px 1fr 36px;
  gap:8px;
}

body:not(.reading) .speed-control button{
  min-height:36px;
  height:36px;
  border-radius:9px;
}

body:not(.reading) .segmented{
  gap:5px;
}

body:not(.reading) .segmented button{
  min-height:34px;
  padding:6px 7px;
  border-radius:9px;
  font-size:11px;
}

body:not(.reading) .checkrow{
  margin:7px 0;
  font-size:12px;
  color:#c8c8c8;
}

body:not(.reading) .checkrow input{
  width:16px;
  height:16px;
}

body:not(.reading) .playrow{
  gap:8px;
  padding:6px 0 0;
  border-top:0;
}

body:not(.reading) #pauseBtn{
  display:none;
}

body:not(.reading) #startBtn{
  flex:1;
  min-height:50px;
  border-radius:13px;
  font-size:14px;
}

body:not(.reading) #topBtn{
  flex:0 0 118px;
  min-height:50px;
  border-radius:13px;
  font-size:13px;
}

/* O modo de leitura volta a ocupar toda a viewport. */
body.reading{
  overflow:hidden;
}

body.reading .app{
  width:100%;
  max-width:none;
  height:100vh;
  height:100dvh;
  margin:0;
}

/* Controles da leitura um pouco mais compactos. */
body.reading #readerControls{
  padding:6px;
  gap:5px;
  border-radius:16px;
  border-color:#242424;
  background:rgba(5,5,5,.86);
}

body.reading #readerControls button{
  min-height:42px;
  border-radius:10px;
}

@media(max-width:1050px){
  body:not(.reading) .app{
    width:min(100%,900px);
  }

  body:not(.reading) .settings{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:640px){
  body:not(.reading) .app{
    width:100%;
    padding:
      calc(env(safe-area-inset-top) + 12px)
      12px
      calc(env(safe-area-inset-bottom) + 14px);
  }

  body:not(.reading) header{
    padding-bottom:12px;
  }

  body:not(.reading) #editorPanel{
    padding-top:12px;
  }

  body:not(.reading) #script{
    height:240px;
    min-height:240px;
    padding:15px;
  }

  body:not(.reading) .settings{
    grid-template-columns:1fr;
    gap:8px;
    padding-top:12px;
  }

  body:not(.reading) .setting{
    min-height:0;
    padding:12px;
  }

  body:not(.reading) .playrow{
    position:sticky;
    bottom:0;
    z-index:12;
    padding:
      9px 0
      calc(env(safe-area-inset-bottom) + 8px);
    background:linear-gradient(to top,#000 72%,rgba(0,0,0,.88),rgba(0,0,0,0));
  }

  body:not(.reading) #topBtn{
    flex:0 0 92px;
  }
}

</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand">TELEPROMPTER</div>
    <div class="actions">
      <button id="newBtn" type="button">Novo</button>
      <button id="saveBtn" type="button">Salvar</button>
    </div>
  </header>

  <main>
    <section id="editorPanel">
      <input id="scriptTitle" maxlength="100" placeholder="Nome do roteiro" value="Meu roteiro" aria-label="Nome do roteiro">
      <textarea id="script" spellcheck="false" placeholder="Cole ou escreva seu roteiro aqui..."></textarea>

      <div class="file-row">
        <label class="file-label" for="importFile">Importar .txt</label>
        <input id="importFile" type="file" accept=".txt,text/plain">
        <button id="exportBtn" type="button">Exportar .txt</button>
        <button id="clearBtn" type="button">Limpar texto</button>
      </div>

      <div class="status" id="status" role="status">Salvamento automático ativado.</div>
    </section>

    <section id="reader" aria-label="Leitor">
      <div id="readerText"></div>
    </section>
  </main>

  <section class="settings" aria-label="Ajustes">
    <div class="setting">
      <label class="setting-title" for="speed">Velocidade <output id="speedOut">3</output></label>
      <div class="speed-control">
        <button id="speedDown" type="button" aria-label="Diminuir velocidade">−</button>
        <input id="speed" type="range" min="1" max="10" step="1" value="3">
        <button id="speedUp" type="button" aria-label="Aumentar velocidade">+</button>
      </div>
    </div>

    <div class="setting">
      <label class="setting-title" for="fontSize">Tamanho da fonte <output id="fontOut">36 px</output></label>
      <input id="fontSize" type="range" min="20" max="72" step="1" value="36">
    </div>

    <div class="setting">
      <label class="setting-title" for="lineHeight">Espaçamento <output id="lineOut">1,6×</output></label>
      <input id="lineHeight" type="range" min="1.1" max="2.3" step="0.1" value="1.6">
    </div>

    <div class="setting">
      <label class="setting-title" for="textWidth">Largura do texto <output id="widthOut">72%</output></label>
      <input id="textWidth" type="range" min="40" max="100" step="1" value="72">
      <div class="segmented" style="margin-top:7px">
        <button type="button" class="widthPreset" data-width="50">Estreito</button>
        <button type="button" class="widthPreset active" data-width="72">Médio</button>
        <button type="button" class="widthPreset" data-width="90">Largo</button>
      </div>
    </div>

    <div class="setting">
      <label class="setting-title">Alinhamento</label>
      <div class="segmented two">
        <button id="alignLeft" type="button" class="active">Esquerda</button>
        <button id="alignCenter" type="button">Centro</button>
      </div>
    </div>

    <div class="setting">
      <label class="setting-title">Leitura</label>
      <label class="checkrow"><input id="mirror" type="checkbox"> Texto espelhado</label>
      <label class="checkrow"><input id="focusGuideToggle" type="checkbox" checked> Guia de foco central</label>
      <label class="checkrow"><input id="countdownToggle" type="checkbox" checked> Contagem 3–2–1</label>
    </div>

    <div class="setting">
      <label class="setting-title">Comportamento</label>
      <label class="checkrow"><input id="autoHideToggle" type="checkbox" checked> Ocultar controles automaticamente</label>
      <label class="checkrow"><input id="resumeToggle" type="checkbox" checked> Retomar da última posição</label>
      <label class="checkrow"><input id="keepAwake" type="checkbox" checked> Evitar suspensão</label>
    </div>

    <div class="setting">
      <label class="setting-title">Gestos</label>
      <div style="font-size:12px;color:#aaa;line-height:1.55">
        1 toque: pausar/continuar<br>
        2 toques: mostrar/ocultar controles<br>
        Arraste: reposicionar o texto
      </div>
    </div>
  </section>

  <div class="playrow">
    <button class="primary" id="startBtn" type="button">▶ Iniciar leitura</button>
    <button id="pauseBtn" type="button">Ⅱ Pausar</button>
    <button id="topBtn" type="button">↑ Início</button>
  </div>
</div>

<div id="progressWrap" aria-hidden="true"><div id="progressBar"></div></div>
<div id="focusGuide" aria-hidden="true"></div>
<div id="countdown" aria-live="polite"></div>
<div id="readerHint">1 toque pausa • 2 toques controles • arraste reposiciona</div>

<div id="readerControls" aria-label="Controles da leitura">
  <button id="liveSlower" class="lock-sensitive" type="button" aria-label="Mais devagar">−</button>
  <span id="liveSpeed">3/10</span>
  <button id="livePause" class="wide" type="button">Ⅱ Pausar</button>
  <button id="liveFaster" class="lock-sensitive" type="button" aria-label="Mais rápido">+</button>
  <span id="progressText">0%</span>
  <button id="lockBtn" type="button" aria-label="Bloquear controles">🔓</button>
  <button id="exitFloat" class="lock-sensitive" type="button" aria-label="Sair">✕</button>
</div>

<script>
(function(){
'use strict';

function $(id){return document.getElementById(id)}
function clamp(value,min,max){return Math.max(min,Math.min(max,value))}

var title=$('scriptTitle');
var script=$('script');
var reader=$('reader');
var readerText=$('readerText');
var status=$('status');
var speed=$('speed');

var running=false;
var lastTime=0;
var raf=null;
var wakeLock=null;
var scrollPosition=0;
var key='simple-teleprompter-v3';
var autosaveTimer=null;
var controlsTimer=null;
var hintTimer=null;
var tapTimer=null;
var lastTapAt=0;
var locked=false;
var alignment='left';
var readingStarted=false;
var programmaticScroll=false;
var pointerMoved=false;
var pointerStartY=0;

function message(text){status.textContent=text}

function getSpeedLevel(){
  return Number(speed.value)||3;
}

/* Curva mais refinada nas velocidades baixas e médias. */
function getPixelsPerSecond(){
  var levels=[14,20,27,35,44,55,68,83,101,122];
  return levels[getSpeedLevel()-1];
}

function setAlignment(value){
  alignment=value==='center'?'center':'left';
  readerText.style.textAlign=alignment;
  $('alignLeft').classList.toggle('active',alignment==='left');
  $('alignCenter').classList.toggle('active',alignment==='center');
  scheduleAutosave();
}

function syncWidthPresets(){
  var current=Number($('textWidth').value);
  document.querySelectorAll('.widthPreset').forEach(function(btn){
    btn.classList.toggle('active',Number(btn.dataset.width)===current);
  });
}

function syncSettings(){
  $('speedOut').textContent=speed.value;
  $('liveSpeed').textContent=speed.value+'/10';
  $('fontOut').textContent=$('fontSize').value+' px';
  $('lineOut').textContent=Number($('lineHeight').value).toLocaleString('pt-BR')+'×';
  $('widthOut').textContent=$('textWidth').value+'%';

  readerText.style.fontSize=$('fontSize').value+'px';
  readerText.style.lineHeight=$('lineHeight').value;
  readerText.style.width=$('textWidth').value+'%';
  readerText.style.marginLeft='auto';
  readerText.style.marginRight='auto';
  readerText.style.textAlign=alignment;

  document.body.classList.toggle('mirrored',$('mirror').checked);
  document.body.classList.toggle('show-focus',$('focusGuideToggle').checked);
  syncWidthPresets();
  updateProgress();
  scheduleAutosave();
}

function changeSpeed(delta){
  if(locked)return;
  speed.value=String(clamp(getSpeedLevel()+delta,1,10));
  syncSettings();
  revealControls();
}

function renderReader(){
  readerText.textContent=script.value||'Adicione seu roteiro antes de iniciar.';
  updateProgress();
}

function currentData(){
  return {
    title:title.value,
    text:script.value,
    speed:speed.value,
    font:$('fontSize').value,
    line:$('lineHeight').value,
    width:$('textWidth').value,
    mirror:$('mirror').checked,
    focus:$('focusGuideToggle').checked,
    countdown:$('countdownToggle').checked,
    autoHide:$('autoHideToggle').checked,
    resume:$('resumeToggle').checked,
    keepAwake:$('keepAwake').checked,
    alignment:alignment,
    position:Math.max(0,reader.scrollTop||scrollPosition||0)
  };
}

function persist(showMessage){
  try{
    localStorage.setItem(key,JSON.stringify(currentData()));
    if(showMessage)message('Roteiro e ajustes salvos.');
  }catch(e){
    if(showMessage)message('Não foi possível salvar neste navegador. Use Exportar .txt.');
  }
}

function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer=setTimeout(function(){
    persist(false);
    message('Salvo automaticamente.');
  },700);
}

function loadSaved(){
  try{
    var raw=localStorage.getItem(key)||
      localStorage.getItem('simple-teleprompter-v2')||
      localStorage.getItem('simple-teleprompter-v1');

    var d=raw?JSON.parse(raw):null;
    if(d){
      title.value=d.title||'Meu roteiro';
      script.value=d.text||'';
      speed.value=d.speed||3;
      $('fontSize').value=d.font||36;
      $('lineHeight').value=d.line||1.6;
      $('textWidth').value=d.width||72;
      $('mirror').checked=!!d.mirror;
      $('focusGuideToggle').checked=d.focus!==false;
      $('countdownToggle').checked=d.countdown!==false;
      $('autoHideToggle').checked=d.autoHide!==false;
      $('resumeToggle').checked=d.resume!==false;
      $('keepAwake').checked=d.keepAwake!==false;
      alignment=d.alignment==='center'?'center':'left';
      scrollPosition=Number(d.position)||0;
    }
  }catch(e){}

  setAlignment(alignment);
  renderReader();
  syncSettings();
  message('Salvamento automático ativado.');
}

function stopLoop(){
  running=false;
  if(raf!==null)cancelAnimationFrame(raf);
  raf=null;
  lastTime=0;
  $('pauseBtn').textContent='▶ Continuar';
  $('livePause').textContent='▶ Continuar';
  persist(false);
}

function startLoop(){
  if(!document.body.classList.contains('reading'))return;
  running=true;
  lastTime=0;
  scrollPosition=reader.scrollTop;
  $('pauseBtn').textContent='Ⅱ Pausar';
  $('livePause').textContent='Ⅱ Pausar';
  if(raf!==null)cancelAnimationFrame(raf);
  raf=requestAnimationFrame(tick);
}

function tick(now){
  if(!running)return;

  if(lastTime!==0){
    var deltaSeconds=Math.min((now-lastTime)/1000,0.08);
    scrollPosition+=getPixelsPerSecond()*deltaSeconds;

    programmaticScroll=true;
    reader.scrollTop=scrollPosition;
    programmaticScroll=false;

    var maxScroll=Math.max(0,reader.scrollHeight-reader.clientHeight);
    if(scrollPosition>=maxScroll-1){
      reader.scrollTop=maxScroll;
      scrollPosition=maxScroll;
      updateProgress();
      stopLoop();
      return;
    }
  }

  lastTime=now;
  updateProgress();
  raf=requestAnimationFrame(tick);
}

function togglePause(){
  if(!document.body.classList.contains('reading')){
    message('Toque em Iniciar leitura para começar.');
    return;
  }
  if(running)stopLoop();
  else startLoop();
  revealControls();
}

function updateProgress(){
  var max=Math.max(0,reader.scrollHeight-reader.clientHeight);
  var pos=clamp(reader.scrollTop||scrollPosition||0,0,max||0);
  var pct=max>0?Math.round((pos/max)*100):0;
  $('progressBar').style.width=pct+'%';
  $('progressText').textContent=pct+'%';
}

function showHint(){
  document.body.classList.add('show-hint');
  clearTimeout(hintTimer);
  hintTimer=setTimeout(function(){
    document.body.classList.remove('show-hint');
  },3500);
}

function revealControls(){
  document.body.classList.remove('controls-hidden');
  clearTimeout(controlsTimer);
  if($('autoHideToggle').checked && document.body.classList.contains('reading')){
    controlsTimer=setTimeout(function(){
      document.body.classList.add('controls-hidden');
    },3000);
  }
}

function toggleControlsVisibility(){
  clearTimeout(controlsTimer);
  var hidden=document.body.classList.toggle('controls-hidden');
  if(!hidden)revealControls();
}

function setLocked(value){
  locked=!!value;
  document.body.classList.toggle('locked',locked);
  $('lockBtn').classList.toggle('locked-state',locked);
  $('lockBtn').textContent=locked?'🔒':'🔓';
  $('lockBtn').setAttribute('aria-label',locked?'Desbloquear controles':'Bloquear controles');
  revealControls();
}

function runCountdown(){
  return new Promise(function(resolve){
    if(!$('countdownToggle').checked){
      resolve();
      return;
    }

    var overlay=$('countdown');
    var values=['3','2','1'];
    var i=0;
    overlay.classList.add('show');
    overlay.textContent=values[i];

    var timer=setInterval(function(){
      i++;
      if(i>=values.length){
        clearInterval(timer);
        overlay.textContent='';
        overlay.classList.remove('show');
        resolve();
        return;
      }
      overlay.textContent=values[i];
    },700);
  });
}

async function requestWakeLock(){
  if(!$('keepAwake').checked||!('wakeLock' in navigator))return;
  try{wakeLock=await navigator.wakeLock.request('screen')}catch(e){}
}

async function releaseWakeLock(){
  try{if(wakeLock)await wakeLock.release()}catch(e){}
  wakeLock=null;
}

function requestFullscreen(){
  try{
    var el=document.documentElement;
    var requestFs=el.requestFullscreen||el.webkitRequestFullscreen;
    if(requestFs){
      var result=requestFs.call(el);
      if(result&&typeof result.catch==='function')result.catch(function(){});
    }
  }catch(e){}
}

function exitFullscreen(){
  try{
    var exitFs=document.exitFullscreen||document.webkitExitFullscreen;
    if((document.fullscreenElement||document.webkitFullscreenElement)&&exitFs){
      var result=exitFs.call(document);
      if(result&&typeof result.catch==='function')result.catch(function(){});
    }
  }catch(e){}
}

async function start(){
  renderReader();
  document.body.classList.add('reading');
  document.body.classList.toggle('mirrored',$('mirror').checked);
  document.body.classList.toggle('show-focus',$('focusGuideToggle').checked);
  setLocked(false);

  var saved=0;
  try{
    var raw=localStorage.getItem(key);
    var d=raw?JSON.parse(raw):null;
    saved=d&&Number(d.position)?Number(d.position):0;
  }catch(e){}

  if($('resumeToggle').checked&&saved>0){
    reader.scrollTop=saved;
    scrollPosition=saved;
  }else{
    reader.scrollTop=0;
    scrollPosition=0;
  }

  updateProgress();
  requestWakeLock();
  requestFullscreen();
  revealControls();
  showHint();

  await runCountdown();

  if(!document.body.classList.contains('reading'))return;
  readingStarted=true;
  startLoop();
}

function exitReading(){
  if(locked)return;
  stopLoop();
  persist(false);
  document.body.classList.remove('reading','controls-hidden','show-hint');
  setLocked(false);
  exitFullscreen();
  releaseWakeLock();
  readingStarted=false;
}

function goTop(){
  reader.scrollTop=0;
  scrollPosition=0;
  updateProgress();
  persist(false);
}

/* Editor */
$('newBtn').addEventListener('click',function(){
  if(script.value.trim()&&!confirm('Criar novo roteiro? O atual já foi salvo automaticamente.'))return;
  title.value='Novo roteiro';
  script.value='';
  reader.scrollTop=0;
  scrollPosition=0;
  renderReader();
  scheduleAutosave();
  message('Novo roteiro.');
});

$('saveBtn').addEventListener('click',function(){persist(true)});

$('clearBtn').addEventListener('click',function(){
  if(confirm('Limpar o texto do roteiro?')){
    script.value='';
    reader.scrollTop=0;
    scrollPosition=0;
    renderReader();
    scheduleAutosave();
  }
});

$('exportBtn').addEventListener('click',function(){
  var blob=new Blob([script.value],{type:'text/plain;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download=(title.value.trim()||'roteiro').replace(/[\\/:*?"<>|]/g,'_')+'.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},1000);
});

$('importFile').addEventListener('change',function(e){
  var file=e.target.files&&e.target.files[0];
  if(!file)return;

  var readerFile=new FileReader();
  readerFile.onload=function(){
    script.value=String(readerFile.result||'');
    title.value=file.name.replace(/\.txt$/i,'');
    reader.scrollTop=0;
    scrollPosition=0;
    renderReader();
    scheduleAutosave();
    message('Roteiro importado e salvo automaticamente.');
    e.target.value='';
  };
  readerFile.onerror=function(){
    message('Não foi possível importar este arquivo.');
    e.target.value='';
  };
  readerFile.readAsText(file,'UTF-8');
});

/* Ajustes */
$('speedDown').addEventListener('click',function(){changeSpeed(-1)});
$('speedUp').addEventListener('click',function(){changeSpeed(1)});
$('liveSlower').addEventListener('click',function(){changeSpeed(-1)});
$('liveFaster').addEventListener('click',function(){changeSpeed(1)});

$('alignLeft').addEventListener('click',function(){setAlignment('left')});
$('alignCenter').addEventListener('click',function(){setAlignment('center')});

document.querySelectorAll('.widthPreset').forEach(function(btn){
  btn.addEventListener('click',function(){
    $('textWidth').value=btn.dataset.width;
    syncSettings();
  });
});

[
  'speed','fontSize','lineHeight','textWidth','mirror',
  'focusGuideToggle','countdownToggle','autoHideToggle',
  'resumeToggle','keepAwake'
].forEach(function(id){
  $(id).addEventListener('input',syncSettings);
  $(id).addEventListener('change',syncSettings);
});

$('autoHideToggle').addEventListener('change',function(){
  if(this.checked)revealControls();
  else{
    clearTimeout(controlsTimer);
    document.body.classList.remove('controls-hidden');
  }
});

title.addEventListener('input',scheduleAutosave);
script.addEventListener('input',function(){
  renderReader();
  scheduleAutosave();
});

/* Controles de leitura */
$('startBtn').addEventListener('click',start);
$('pauseBtn').addEventListener('click',togglePause);
$('topBtn').addEventListener('click',function(){
  if(document.body.classList.contains('reading'))goTop();
  else window.scrollTo(0,0);
});
$('livePause').addEventListener('click',togglePause);
$('exitFloat').addEventListener('click',exitReading);
$('lockBtn').addEventListener('click',function(){setLocked(!locked)});

/* Corrige reposicionamento manual inclusive enquanto a rolagem está rodando. */
reader.addEventListener('scroll',function(){
  if(!programmaticScroll){
    scrollPosition=reader.scrollTop;
  }
  updateProgress();
  persist(false);
},{passive:true});

/* Detecta movimento para não interpretar um arraste como toque. */
reader.addEventListener('pointerdown',function(e){
  pointerMoved=false;
  pointerStartY=e.clientY;
  revealControls();
},{passive:true});

reader.addEventListener('pointermove',function(e){
  if(Math.abs(e.clientY-pointerStartY)>8)pointerMoved=true;
},{passive:true});

/* 1 toque = pausa/continua; 2 toques = controles.
   Um pequeno atraso evita que o duplo toque pause duas vezes. */
reader.addEventListener('pointerup',function(e){
  if(pointerMoved)return;
  if(e.target!==reader&&e.target!==readerText)return;

  var now=Date.now();
  if(now-lastTapAt<280){
    clearTimeout(tapTimer);
    lastTapAt=0;
    toggleControlsVisibility();
    return;
  }

  lastTapAt=now;
  clearTimeout(tapTimer);
  tapTimer=setTimeout(function(){
    if(lastTapAt!==0){
      togglePause();
      lastTapAt=0;
    }
  },285);
},{passive:true});

/* Qualquer interação com os controles reinicia o auto-hide. */
$('readerControls').addEventListener('pointerdown',function(){
  revealControls();
},{passive:true});

/* Persistência da posição ao sair/ocultar a página. */
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'){
    persist(false);
  }else if(document.body.classList.contains('reading')){
    requestWakeLock();
    revealControls();
  }
});

window.addEventListener('beforeunload',function(){persist(false)});

/* Atalhos de teclado úteis no desktop. */
document.addEventListener('keydown',function(e){
  if(!document.body.classList.contains('reading'))return;

  if(e.code==='Space'){
    e.preventDefault();
    togglePause();
  }
  if(e.key==='ArrowUp')changeSpeed(1);
  if(e.key==='ArrowDown')changeSpeed(-1);
  if(e.key==='Home')goTop();
  if(e.key==='Escape'&&!locked)exitReading();
  if(e.key.toLowerCase()==='l')setLocked(!locked);
});

/* Evita que um clique nos controles chegue ao leitor. */
$('readerControls').addEventListener('click',function(e){e.stopPropagation()});

loadSaved();
})();
</script>
</body>
</html>
