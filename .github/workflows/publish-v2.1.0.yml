name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (example: v2.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a GitHub Release when it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          elif [ -f "docs/release-notes/$RELEASE_TAG.md" ]; then
            gh release create "$RELEASE_TAG" --target main --title "Teleprompter Web $RELEASE_TAG" --notes-file "docs/release-notes/$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" --target main --title "Teleprompter Web $RELEASE_TAG" --generate-notes
          fi
