name: Publish Teleprompter Web v2.1.0

on:
  push:
    paths:
      - '.github/workflows/publish-v2.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Publish the first release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.1.0 >/dev/null 2>&1; then
            echo 'Release v2.1.0 already exists. Nothing to do.'
          else
            gh release create v2.1.0 \
              --target main \
              --title 'Teleprompter Web v2.1.0' \
              --notes-file docs/release-notes/v2.1.0.md \
              --latest
          fi
